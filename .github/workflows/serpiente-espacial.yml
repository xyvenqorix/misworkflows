name: Serpiente espacial

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/serpiente-espacial.svg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Crear serpiente espacial
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const svg = String.raw`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
              <defs>
                <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#061126"/>
                  <stop offset="55%" stop-color="#0a2340"/>
                  <stop offset="100%" stop-color="#03101a"/>
                </linearGradient>

                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="4" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>

              <rect width="960" height="320" rx="24" fill="url(#space)"/>

              <g fill="#c9e8ff">
                <circle cx="70" cy="35" r="2"/><circle cx="180" cy="110" r="1"/>
                <circle cx="300" cy="60" r="2"/><circle cx="420" cy="250" r="1"/>
                <circle cx="570" cy="80" r="2"/><circle cx="690" cy="210" r="1"/>
                <circle cx="810" cy="45" r="2"/><circle cx="920" cy="175" r="1"/>
                <circle cx="110" cy="280" r="1"/><circle cx="520" cy="170" r="1"/>
                <animateTransform attributeName="transform" type="translate"
                  values="0 -40;0 40;0 -40"
                  dur="6s"
                  repeatCount="indefinite"/>
              </g>

              <ellipse cx="150" cy="280" rx="210" ry="70" fill="#16a34a" opacity=".08"/>
              <ellipse cx="825" cy="45" rx="180" ry="55" fill="#38bdf8" opacity=".09"/>

              <!-- Manzanas -->
              <g filter="url(#glow)">
                <g transform="translate(710 82)">
                  <animate attributeName="opacity"
                    values="1;1;0;0;0;1"
                    keyTimes="0;.24;.30;.78;.92;1"
                    dur="8s"
                    repeatCount="indefinite"/>
                  <circle r="12" fill="#ef4444"/>
                  <path d="M0 -11 Q8 -25 17 -19" fill="none" stroke="#67d66b" stroke-width="5" stroke-linecap="round"/>
                  <circle cx="-4" cy="-4" r="3" fill="#ffd7d7"/>
                </g>

                <g transform="translate(305 238)" opacity="0">
                  <animate attributeName="opacity"
                    values="0;0;0;1;1;0"
                    keyTimes="0;.20;.34;.40;.76;.84"
                    dur="8s"
                    repeatCount="indefinite"/>
                  <circle r="12" fill="#ef4444"/>
                  <path d="M0 -11 Q8 -25 17 -19" fill="none" stroke="#67d66b" stroke-width="5" stroke-linecap="round"/>
                  <circle cx="-4" cy="-4" r="3" fill="#ffd7d7"/>
                </g>
              </g>

              <!-- Serpiente -->
              <g filter="url(#glow)">
                <animateTransform attributeName="transform" type="translate"
                  values="0 -180;0 180;0 -180"
                  dur="8s"
                  repeatCount="indefinite"/>

                <path d="M300 455
                         C170 390 180 280 320 275
                         C470 270 500 165 385 130
                         C275 96 275 15 410 -10
                         C560 -38 710 18 710 82"
                  fill="none"
                  stroke="#126a45"
                  stroke-width="37"
                  stroke-linecap="round"/>

                <path d="M300 455
                         C170 390 180 280 320 275
                         C470 270 500 165 385 130
                         C275 96 275 15 410 -10
                         C560 -38 710 18 710 82"
                  fill="none"
                  stroke="#38b26d"
                  stroke-width="28"
                  stroke-linecap="round"
                  stroke-dasharray="5 8"/>

                <!-- Cabeza -->
                <g transform="translate(710 82)">
                  <ellipse cx="0" cy="0" rx="28" ry="23" fill="#46c878" stroke="#9dffc4" stroke-width="3"/>
                  <ellipse cx="10" cy="-7" rx="5" ry="7" fill="#102d22"/>
                  <circle cx="12" cy="-9" r="2" fill="#ffffff"/>
                  <path d="M10 10 Q19 17 28 10" fill="none" stroke="#153d2b" stroke-width="3" stroke-linecap="round"/>
                  <path d="M27 10 L41 15" stroke="#ef6b83" stroke-width="3" stroke-linecap="round">
                    <animate attributeName="opacity" values="0;1;0" dur=".7s" repeatCount="indefinite"/>
                  </path>
                </g>
              </g>

              <!-- Destello al comer -->
              <g transform="translate(710 82)" fill="none" stroke="#fff3a3" stroke-width="5" opacity="0">
                <animate attributeName="opacity"
                  values="0;0;1;0;0"
                  keyTimes="0;.21;.27;.36;1"
                  dur="8s"
                  repeatCount="indefinite"/>
                <circle r="16">
                  <animate attributeName="r"
                    values="8;8;42;60;8"
                    dur="8s"
                    repeatCount="indefinite"/>
                </circle>
              </g>
            </svg>`;

            const path = "assets/serpiente-espacial.svg";
            let sha;

            try {
              const old = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });
              sha = old.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: "main",
              message: "Crear serpiente espacial",
              content: Buffer.from(svg).toString("base64"),
              ...(sha ? { sha } : {})
            });
