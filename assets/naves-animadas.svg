<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="#9ab9e8" opacity=".8">
    <circle cx="50" cy="40" r="2"/>
    <circle cx="130" cy="185" r="2"/>
    <circle cx="240" cy="55" r="2"/>
    <circle cx="390" cy="205" r="2"/>
    <circle cx="540" cy="38" r="2"/>
    <circle cx="670" cy="185" r="2"/>
  </g>

  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 8;0 0"
      dur="1.5s"
      repeatCount="indefinite"/>

    <path d="M115 118 L55 164 L87 164 L115 194 L143 164 L175 164 Z"
      fill="#4daed0"
      stroke="#d5f8ff"
      stroke-width="3"/>
    <path d="M115 128 L101 164 L115 177 L129 164 Z" fill="#17395e"/>
    <circle cx="115" cy="150" r="8" fill="#e4fcff"/>
  </g>

  <path d="M175 150 H430"
    stroke="#7ceeff"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0"
    filter="url(#glow)">
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;.2;.25;.42;.47;1"
      dur="3s"
      repeatCount="indefinite"/>
    <animate attributeName="d"
      values="M175 150 H190;M175 150 H470"
      dur="3s"
      repeatCount="indefinite"/>
  </path>

  <g opacity="1">
    <animate attributeName="opacity"
      values="1;1;1;0;0;1"
      keyTimes="0;.62;.68;.72;.92;1"
      dur="3s"
      repeatCount="indefinite"/>

    <path d="M500 125 L550 96 L600 125 L580 168 L520 168 Z"
      fill="#8557c4"
      stroke="#efcbff"
      stroke-width="3"/>
    <path d="M525 126 L550 110 L575 126" fill="#3e255b"/>
    <circle cx="550" cy="143" r="9" fill="#ffd0e8"/>
  </g>

  <g fill="none" stroke="#ffd46d" stroke-width="6" opacity="0" filter="url(#glow)">
    <animate attributeName="opacity"
      values="0;0;0;1;0;0"
      keyTimes="0;.64;.69;.76;.86;1"
      dur="3s"
      repeatCount="indefinite"/>

    <circle cx="550" cy="143" r="10">
      <animate attributeName="r"
        values="8;8;8;42;55;8"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>
  </g>
</svg>